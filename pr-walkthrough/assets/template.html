<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
:root {
  color-scheme: light;
  --surface: #fcfcfb; --panel: #ffffff; --panel-2: #f4f3f0; --line: #e2e0da; --line-2: #cfccc4;
  --ink: #0b0b0b; --ink-2: #52514e; --ink-3: #77756f;
  --blue: #2a78d6; --blue-wash: #eaf2fc; --blue-ink: #184f95;
  --orange: #eb6834; --aqua: #1baf7a;
  --red: #c93a39; --red-wash: #fdeeee; --green: #0f7a3d; --green-wash: #e8f6ee; --amber-wash: #fdf5e3; --amber: #9a6a00;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--surface); color: var(--ink); font: 16px/1.6 var(--sans); }
a { color: var(--blue-ink); }
code { font-family: var(--mono); font-size: 0.88em; background: var(--panel-2); padding: 1px 5px; border-radius: 4px; }
h1, h2, h3, h4 { line-height: 1.25; }
h1 { font-size: 32px; margin: 4px 0 10px; }
h2 { font-size: 25px; margin: 0 0 8px; padding-top: 10px; }
h3 { font-size: 19px; margin: 26px 0 8px; }
h4 { font-size: 16px; margin: 16px 0 6px; }
p, ul, ol { max-width: 800px; }
.layout { display: grid; grid-template-columns: 250px minmax(0, 1fr); }
nav#toc { position: sticky; top: 0; height: 100vh; overflow-y: auto; border-right: 1px solid var(--line); padding: 20px 14px; background: var(--panel); font-size: 14px; }
nav#toc .brand { font-weight: 700; font-size: 15px; }
nav#toc .brand a { color: var(--ink); text-decoration: none; }
nav#toc .sub { color: var(--ink-3); font-size: 12.5px; margin: 2px 0 14px; }
nav#toc ol { list-style: none; padding: 0; margin: 0; }
nav#toc li a { display: block; padding: 5px 8px; border-radius: 6px; color: var(--ink-2); text-decoration: none; }
nav#toc li a:hover { background: var(--panel-2); color: var(--ink); }
nav#toc li a.on { background: var(--blue-wash); color: var(--blue-ink); font-weight: 600; }
nav#toc .part { margin: 14px 8px 4px; font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); }
main { max-width: 1180px; padding: 26px 40px 140px; }
section { padding: 24px 0 28px; border-bottom: 1px solid var(--line); scroll-margin-top: 8px; }
.kicker { font-size: 12.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--blue-ink); font-weight: 700; }
.lede { font-size: 18px; color: var(--ink-2); max-width: 820px; }
.lede p { max-width: none; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 18px; margin: 14px 0; }
.card.blue { background: var(--blue-wash); border-color: #c4dbf6; }
.card.amber { background: var(--amber-wash); border-color: #f0dfb3; }
.card.red { background: var(--red-wash); border-color: #f2c9c8; }
.card.green { background: var(--green-wash); border-color: #bfe3cd; }
.card > :first-child { margin-top: 0; }
.card > :last-child { margin-bottom: 0; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.facts { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 14px; color: var(--ink-2); margin: 10px 0; }
.facts b { color: var(--ink); font-weight: 600; }
.pill { display: inline-block; font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 999px; white-space: nowrap; border: 1px solid var(--line-2); background: var(--panel-2); color: var(--ink-2); }
.pill.red { background: var(--red-wash); color: var(--red); border-color: #f2c9c8; }
.pill.green { background: var(--green-wash); color: var(--green); border-color: #bfe3cd; }
.pill.blue { background: var(--blue-wash); color: var(--blue-ink); border-color: #c4dbf6; }
.pill.amber { background: var(--amber-wash); color: var(--amber); border-color: #f0dfb3; }
.btn { font: inherit; font-size: 14px; border: 1px solid var(--line-2); background: #fff; padding: 6px 12px; border-radius: 7px; cursor: pointer; color: var(--ink); text-decoration: none; display: inline-block; }
.btn:hover { border-color: var(--blue); }
.btn.on { background: var(--blue); border-color: var(--blue); color: #fff; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 10px 0; }
@media (max-width: 1000px) { .layout { grid-template-columns: 1fr; } nav#toc { display: none; } main { padding: 18px 16px 90px; } .grid2 { grid-template-columns: 1fr; } }
/* concept links and drawer */
a.c { color: var(--blue-ink); text-decoration: none; border-bottom: 1px dotted var(--blue); cursor: pointer; }
a.c:hover { background: var(--blue-wash); }
#tip { position: fixed; z-index: 60; max-width: 340px; background: #1a1a19; color: #fff; padding: 9px 12px; border-radius: 8px; font-size: 13.5px; line-height: 1.45; pointer-events: none; opacity: 0; transition: opacity .1s; box-shadow: 0 6px 20px rgba(0,0,0,.18); }
#tip b { display: block; margin-bottom: 2px; }
#drawer { position: fixed; top: 0; right: 0; width: min(560px, 100vw); height: 100vh; background: #fff; border-left: 1px solid var(--line-2); box-shadow: -10px 0 30px rgba(0,0,0,.12); z-index: 70; transform: translateX(105%); transition: transform .18s ease; display: flex; flex-direction: column; }
#drawer.open { transform: none; }
#drawer header { padding: 14px 18px; border-bottom: 1px solid var(--line); display: flex; gap: 10px; align-items: center; }
#drawer header h3 { margin: 0; flex: 1; }
#drawer .body { padding: 6px 18px 40px; overflow-y: auto; }
#drawer .crumbs { font-size: 13px; color: var(--ink-3); margin: 10px 0; }
/* lessons */
.lesson { border: 1px solid var(--line); border-radius: 10px; background: #fff; margin: 10px 0; }
.lesson > summary { list-style: none; padding: 10px 14px; cursor: pointer; display: flex; gap: 10px; align-items: baseline; }
.lesson > summary::-webkit-details-marker { display: none; }
.filefold > summary, details.ctx > summary { cursor: pointer; color: #5b6b7f; font-size: 13px; padding: 4px 0; }
details.ctx[open] > summary { margin-bottom: 4px; }

.lesson > summary .lvl { font-size: 11.5px; color: var(--ink-3); min-width: 54px; }
.lesson > summary .ttl { font-weight: 650; }
.lesson > summary .sh { color: var(--ink-2); font-size: 14px; }
.lesson[open] > summary { background: var(--panel-2); border-bottom: 1px solid var(--line); }
.lesson .lbody { padding: 4px 16px 14px; }
.levelhead { margin: 22px 0 6px; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); font-weight: 700; }
.ex { margin: 12px 0 4px; }
.ex .exttl { font-size: 13px; font-weight: 700; color: var(--ink-2); margin-bottom: 6px; }
/* code rows */
.code-rows { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: #fff; margin: 10px 0 22px; }
.crow { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); border-bottom: 1px solid var(--line); }
.crow:last-child { border-bottom: 0; }
.crow .src { background: #1e1e1c; color: #ecebe4; font: 12.3px/1.6 var(--mono); padding: 6px 0; overflow-x: auto; }
.crow .note { padding: 9px 15px; font-size: 14.5px; line-height: 1.55; }
.crow .note p { margin: 0 0 8px; }
.crow .note p:last-child { margin-bottom: 0; }
.crow.plain .src { background: #2a2a27; color: #9d9b93; }
.crow.plain .note { color: var(--ink-3); font-size: 13px; background: var(--panel-2); }
.crow.gap .src { color: #77756f; font-style: italic; padding: 4px 12px; }
.ln { display: inline-block; width: 40px; text-align: right; padding-right: 6px; color: #7d7b73; user-select: none; }
.sg { display: inline-block; width: 16px; text-align: center; user-select: none; }
.l { white-space: pre; padding-right: 12px; }
.dl { display: block; white-space: nowrap; min-width: 100%; width: max-content; }
.dl.add { background: rgba(46, 160, 67, .22); }
.dl.add .sg { color: #7ee2a0; }
.dl.del { background: rgba(229, 83, 75, .22); }
.dl.del .sg { color: #ff9d97; }
.dl.del .l { text-decoration: line-through; text-decoration-color: rgba(255,157,151,.55); }
.k { color: #f2a65e; } .s { color: #a5d6a7; } .cm { color: #8f8d85; font-style: italic; } .n { color: #9ecbff; } .fdef { color: #ffd479; } .dec { color: #d7a6ff; }
.filehead { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: baseline; margin-top: 30px; }
.filehead h3 { margin: 0; font-family: var(--mono); font-size: 16px; word-break: break-all; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; color: var(--ink-2); margin: 8px 0; }
.legend span::before { content: ""; display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.legend .la::before { background: #cfeed8; } .legend .ld::before { background: #f6d2d0; } .legend .lc::before { background: #2a2a27; }
@media (max-width: 900px) { .crow { grid-template-columns: 1fr; } }
/* thinking */
.steps { counter-reset: st; padding: 0; list-style: none; }
.steps li { position: relative; padding-left: 44px; margin: 14px 0; }
.steps li::before { counter-increment: st; content: counter(st); position: absolute; left: 0; top: 0; width: 30px; height: 30px; border-radius: 50%; background: var(--blue); color: #fff; font-weight: 700; text-align: center; line-height: 30px; }
.steps li h4 { margin: 3px 0 4px; }
.option { border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; margin: 10px 0; background: #fff; }
.option.chosen { border-color: #9fd2b2; background: var(--green-wash); }
.option.rejected { background: #fff; }
.option h4 { margin: 0 0 6px; display: flex; gap: 8px; align-items: baseline; }
/* diagrams */
.figure { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin: 16px 0; }
.figure svg { width: 100%; height: auto; display: block; }
.figure h4 { margin: 0 0 8px; }
.figcap { font-size: 14px; color: var(--ink-2); margin-top: 8px; }
svg text { font-family: var(--sans); }
.dg-box { fill: #fff; stroke: var(--line-2); stroke-width: 1.3; }
.dg-good { fill: var(--green-wash); stroke: #7cc79a; stroke-width: 1.4; }
.dg-bad { fill: var(--red-wash); stroke: #e89a99; stroke-width: 1.4; }
.dg-accent { fill: var(--blue-wash); stroke: var(--blue); stroke-width: 1.4; }
.dg-t { font-size: 13px; fill: var(--ink); }
.dg-s { font-size: 11.5px; fill: var(--ink-2); }
.dg-arrow { stroke: #77756f; stroke-width: 1.6; fill: none; }
.dg-arrow.good { stroke: var(--green); } .dg-arrow.bad { stroke: var(--red); }
.cmp { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.cmp .col { border-radius: 10px; padding: 12px 14px; }
.cmp .col.bad { background: var(--red-wash); } .cmp .col.good { background: var(--green-wash); } .cmp .col.plain { background: var(--panel-2); }
.cmp .col h5 { margin: 0 0 8px; font-size: 12.5px; text-transform: uppercase; letter-spacing: .05em; }
.cmp ol { margin: 0; padding-left: 20px; font-size: 14.5px; }
@media (max-width: 800px) { .cmp { grid-template-columns: 1fr; } }
.strip { display: flex; flex-wrap: wrap; gap: 0; font: 12.5px/1.6 var(--mono); border-radius: 8px; overflow: hidden; border: 1px solid var(--line); }
.strip span { padding: 6px 8px; white-space: pre-wrap; }
.strip .keep { background: var(--green-wash); }
.strip .drop { background: repeating-linear-gradient(45deg, #f4f3f0, #f4f3f0 6px, #ebe9e4 6px, #ebe9e4 12px); color: var(--ink-3); font-style: italic; }
/* evidence */
pre.block { background: #1e1e1c; color: #f0efe9; padding: 12px 14px; border-radius: 8px; overflow-x: auto; font: 12.3px/1.5 var(--mono); white-space: pre-wrap; word-break: break-word; max-height: 420px; margin: 6px 0; }
table.t1 { border-collapse: collapse; width: 100%; font-size: 14px; margin: 10px 0; }
table.t1 th, table.t1 td { border-bottom: 1px solid var(--line); padding: 7px 8px; text-align: left; vertical-align: top; overflow-wrap: anywhere; }
table.t1 th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-3); font-weight: 700; }
table.t1 td.num, table.t1 th.num { text-align: right; font-variant-numeric: tabular-nums; }
.ok { color: var(--green); font-weight: 700; } .bad { color: var(--red); font-weight: 700; } .mute { color: var(--ink-3); }
.cmp .col.bad, .cmp .col.good { color: var(--ink); font-weight: 400; } .cmp .col.bad h5 { color: var(--red); } .cmp .col.good h5 { color: var(--green); }
.run { border: 1px solid var(--line); border-radius: 10px; margin: 12px 0; background: #fff; }
.run > summary { padding: 10px 14px; cursor: pointer; font-weight: 600; }
.run .rbody { padding: 4px 14px 14px; }
.ba { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.ba > div { border-radius: 8px; padding: 10px 12px; }
.ba .before { background: var(--red-wash); } .ba .after { background: var(--green-wash); }
.ba h5 { margin: 0 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; }
@media (max-width: 800px) { .ba { grid-template-columns: 1fr; } }
/* index */
.prgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
.prcard { border: 1px solid var(--line); border-radius: 12px; background: #fff; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; }
.prcard .id { font-family: var(--mono); font-weight: 700; color: var(--blue-ink); }
.prcard h3 { margin: 0; font-size: 17px; }
.prcard .links { margin-top: auto; display: flex; gap: 8px; flex-wrap: wrap; }
.cmeta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 6px; font-size: 12px; }
.kind { font-weight: 700; text-transform: uppercase; letter-spacing: .04em; font-size: 11px; padding: 1px 6px; border-radius: 4px; background: var(--panel-2); color: var(--ink-2); }
.kind.added { background: var(--green-wash); color: var(--green); }
.kind.removed { background: var(--red-wash); color: var(--red); }
.kind.changed { background: var(--amber-wash); color: var(--amber); }
.ghlink { margin-left: auto; font-size: 12px; font-weight: 600; }
.check { margin-top: 6px; padding: 6px 8px; border-left: 3px solid var(--amber); background: var(--amber-wash); font-size: 13.5px; border-radius: 0 4px 4px 0; }
.crow.updated { box-shadow: inset 4px 0 0 #2a78d6; }
ol.lookfirst li { margin: 6px 0; }
table.cmap tr.grp td { font-weight: 700; background: var(--panel-2); font-size: 12.5px; text-transform: uppercase; letter-spacing: .04em; }
.nowrap { white-space: nowrap; }
</style>
</head>
<body>
<div id="tip"></div>
<aside id="drawer" aria-hidden="true"><header><h3 id="dtitle"></h3><button class="btn" id="dclose">Close</button></header><div class="body" id="dbody"></div></aside>
<div class="layout">
  <nav id="toc"></nav>
  <main id="main"></main>
</div>
<script type="application/json" id="data">{{DATA}}</script>
<script>
{{APP}}
</script>
</body>
</html>
